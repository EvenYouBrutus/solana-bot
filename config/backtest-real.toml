# Real historical backtest config.
#
# The accompanying dataset (data/historical_real.jsonl) is built by
# `scripts/build_real_dataset.py` using GeckoTerminal OHLCV + trades.
# Once produced, run:
#
#   cargo run --release -- backtest \
#       --config config/replay.toml \
#       --backtest-config config/backtest-real.toml \
#       --input data/historical_real.jsonl \
#       --format text \
#       --trades data/backtest_trades.json
#
# This file does NOT modify any production strategy threshold.
# Strategy thresholds come from config/replay.toml unchanged.

is_synthetic_data = false

# Chronological boundaries for the three splits.
# With 5 hourly signals on Sep 16, 2026:
#   Train: 15:00-16:00 (2 signals)
#   Validation: 16:00-17:00 (1 signal)
#   OOS: 17:00-20:00 (2 signals)
[split]
train_end = "2026-09-16T16:00:00Z"
validation_start = "2026-09-16T16:00:00Z"
validation_end = "2026-09-16T17:00:00Z"
oos_start = "2026-09-16T17:00:00Z"

# Modeled costs. Conservative defaults for historic reconstruction.
[costs]
entry_swap_fee_bps = 30
entry_priority_fee_usd = 0.002
entry_slippage_bps = 50
entry_price_impact_bps = 20
exit_swap_fee_bps = 30
exit_priority_fee_usd = 0.002
exit_slippage_bps = 50
exit_price_impact_bps = 20
failed_tx_rate = 0.05
failed_tx_cost_usd = 0.002